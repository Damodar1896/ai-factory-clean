name: Autonomous Media Empire 24/7 Cron

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours automatically on cloud
  workflow_dispatch:

jobs:
  run-empire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Master Empire Orchestrator
        run: |
          python automation_core/master_orchestrator.py

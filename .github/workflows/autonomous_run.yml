name: 24/7 Distributed Cloud Autonomous Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  distribute-workload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation_core/requirements.txt

      - name: Run Multi-Cloud Verification & Pipeline Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python automation_core/deploy_manager.py
          python automation_core/pipeline_engine.py
